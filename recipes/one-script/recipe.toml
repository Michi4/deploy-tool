# Template: exactly one file to a target path.
#
# Copy to recipes/<name>/, replace the content of files/, and set the target
# path and values through a profile (profiles/<customer>.env). This file stays
# data-free: everything customer-specific arrives as {{PLACEHOLDERS}} from the
# profile.
#
# Example profile:
#   RECIPE="one-script"
#   TARGETS="srv1.example.com,srv2.example.com"
#   BIN_DIR="/usr/local/bin"
#
#   ./deploy.py plan   -p <profile>
#   ./deploy.py deploy -p <profile>

[recipe]
name = "one-script"
version = "1"
description = "Template: one file to a target path"

[vars.SCRIPTS_DIR]
default = "./scripts"
description = "Directory of the payload scripts (changeable per profile)"

[[files]]
src = "{{SCRIPTS_DIR}}/example.sh"
dest = "{{BIN_DIR}}/example"
mode = "0755"
owner = "root"
group = "root"
validate = "bash -n {{FILE}}"
description = "Example script (placeholder)"
