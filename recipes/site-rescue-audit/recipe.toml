# Recipe site-rescue-audit
#
# Deploys both scripts in ONE run:
#   1. site-audit  -> /usr/local/bin/site-audit   (read-only weekly check)
#   2. site-rescue -> /usr/local/bin/site-rescue  (calls site-audit on "audit")
#
# The order is intentional: first the target, then the caller. That way
# site-rescue never points at a file that does not exist yet. Both belong
# together, hence one recipe instead of two: one lock, one rollback set, one
# status.
#
# Plus: user rescue, sudoers rule, fail2ban whitelist and a temporary test key
# that is present in authorized_keys only during the tests.
#
#   ./deploy.py plan --diff                       dry run of both files
#   ./deploy.py deploy                            roll out (TARGETS/RECIPE from .env)
#   ./deploy.py status                            drift check
#   ./deploy.py test -s TEST_AUDIT=1              tests incl. the real weekly check
#
# The payload lives in scripts/ (path via SCRIPTS_DIR, changeable per profile) -
# so the same recipe can deploy different scripts for different servers.
# The hand-maintained content of ~rescue/.ssh/authorized_keys stays untouched;
# if the key is already there, the block is not added twice.

[recipe]
name = "site-rescue-audit"
version = "2026-11-02"
description = "Deploy site-rescue + site-audit together"
requires = ["bash", "install", "sha256sum"]

[vars.SCRIPTS_DIR]
default = "./scripts"
description = "Directory of the payload scripts (changeable per profile)"

[vars.WHITELIST_IP]
default = ""
description = "IP of the monitoring Mac (empty = no from= and no fail2ban rule)"

# --- Preflight -------------------------------------------------------------

# Advisory only: if the group is missing, useradd fails right after this with a
# less clear message. On new servers this is the only stumbling block.
[[preflight]]
name = "Group for rescue access exists"
level = "warn"
hint = "Group missing: groupadd <group> or adjust SYSTEM_USER_GROUPS in .env"
run = "getent group {{SYSTEM_USER_GROUPS|q}} >/dev/null"

# --- Files -----------------------------------------------------------------
#
# on_conflict = "overwrite": these three paths belong to the recipe. A dry run
# shows differences up front, every write is backed up, and the switch from the
# old single push therefore runs without a prompt.

[[files]]
src = "{{SCRIPTS_DIR}}/site-audit"
dest = "/usr/local/bin/site-audit"
mode = "0755"
owner = "root"
group = "root"
validate = "bash -n {{FILE}}"
on_conflict = "overwrite"
description = "site-audit (read-only, called by site-rescue)"

[[files]]
src = "{{SCRIPTS_DIR}}/site-rescue"
dest = "/usr/local/bin/site-rescue"
mode = "0755"
owner = "root"
group = "root"
validate = "bash -n {{FILE}}"
on_conflict = "overwrite"
description = "site-rescue (diag / block / unblock / audit / restart-pool)"

[[files]]
content = "{{SUDOERS_CONTENT}}\n"
dest = "/etc/sudoers.d/{{SUDOERS_NAME}}"
mode = "0440"
owner = "root"
group = "root"
validate = "visudo -cf {{FILE}}"
on_conflict = "overwrite"
description = "Sudoers rule for rescue access (env_keep for SSH_ORIGINAL_COMMAND)"

# --- Users and keys --------------------------------------------------------

[[users]]
name = "{{SYSTEM_USER}}"
system = true
shell = "/bin/bash"
groups = ["{{SYSTEM_USER_GROUPS}}"]
create_home = true
lock_password = true
description = "SSH access for site-rescue only"

# Permanent key of the monitoring Mac. Only added when RESCUE_PUBKEY is set in
# the profile. If the key already exists in authorized_keys on a host
# (hand-maintained), that stays as is - no duplicate entry.
[[authorized_keys]]
user = "{{SYSTEM_USER}}"
keys = '''{{RESCUE_PUBKEY}}'''
command = "sudo /usr/local/bin/site-rescue"
restrict = true
from = "{{WHITELIST_IP}}"
id = "rescue-key"
if_var = "RESCUE_PUBKEY"
description = "permanent key of the monitoring Mac"

# Only the temporary test key (no keys = no permanent entry).
# The setup is the same as for real access, so the tests really run through
# forced command -> sudo -> site-rescue.
[[authorized_keys]]
user = "{{SYSTEM_USER}}"
command = "sudo /usr/local/bin/site-rescue"
restrict = true
id = "test-key"
ephemeral_test_key = true
description = "temporary test key (only during the tests)"

# --- Operations ------------------------------------------------------------

[[steps]]
name = "Fail2ban whitelist for the monitoring IP"
if_var = "WHITELIST_IP"
sudo = true
unless_cmd = '''test -f /etc/fail2ban/jail.d/99-deploy-whitelist.local && grep -qF -- {{WHITELIST_IP|q}} /etc/fail2ban/jail.d/99-deploy-whitelist.local'''
run = '''
if [ -d /etc/fail2ban/jail.d ]; then
    printf '[DEFAULT]\nignoreip = 127.0.0.1/8 ::1 %s\n' {{WHITELIST_IP|q}} > /etc/fail2ban/jail.d/99-deploy-whitelist.local
    timeout 8 fail2ban-client reload >/dev/null 2>&1 || true
fi
if command -v cscli >/dev/null 2>&1; then
    cscli decisions list --ip {{WHITELIST_IP|q}} >/dev/null 2>&1 || true
fi
'''

# --- Tests -----------------------------------------------------------------

[[tests]]
name = "both scripts installed, executable and syntactically valid"
run = "test -x /usr/local/bin/site-audit && test -x /usr/local/bin/site-rescue && bash -n /usr/local/bin/site-audit && bash -n /usr/local/bin/site-rescue && echo install-ok"
expect = ["^install-ok$"]

# Exercises the real path: forced command -> sudo -> site-rescue.
# "diag" without a domain intentionally ends with rc=1 and "error=domain ...".
[[tests]]
name = "rescue access: forced command, sudo and site-rescue respond"
kind = "ssh"
user = "{{SYSTEM_USER}}"
key = "ephemeral"
run = "diag"
expect_rc = 1
expect = ["^error=domain"]

# Only runs with -s TEST_AUDIT=1: the real weekly check (slow, needs outgoing
# HTTPS). Not critical, so a network problem does not trigger a rollback.
[[tests]]
name = "weekly check: site-rescue forwards audit to site-audit"
kind = "ssh"
user = "{{SYSTEM_USER}}"
key = "ephemeral"
run = "audit"
expect = ["^H\\|done\\|"]
timeout = 1800
critical = false
if_var = "TEST_AUDIT"
